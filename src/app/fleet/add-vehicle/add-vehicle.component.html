<div class="modal-overlay" (click)="onCancel()">
  <div class="modal-box panel" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title">
        <span class="panel-eyebrow">Fleet Management</span>
        <h2 class="panel-title-main">Add New Vehicle</h2>
      </div>
      <button class="close-btn" (click)="onCancel()">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <form (ngSubmit)="onSubmit()" #vehicleForm="ngForm" class="modal-form">
      <div class="form-grid">
        <div class="form-group full-width photo-upload-group">
          <label>Vehicle Photo</label>
          <div class="photo-area" (click)="triggerCamera(fileInput)">
            @if (imagePreview) {
              <img [src]="imagePreview" alt="Preview" class="photo-preview" />
              <div class="photo-overlay">
                <mat-icon>photo_camera</mat-icon>
                <span>Change Photo</span>
              </div>
            } @else {
              <div class="photo-placeholder">
                <mat-icon>add_a_photo</mat-icon>
                <span>Upload or Capture</span>
              </div>
            }
          </div>
          <!-- Hidden Native File Input restricted to images and camera -->
          <input
            type="file"
            accept="image/*"
            capture="environment"
            #fileInput
            style="display: none"
            (change)="onFileSelected($event)"
          />
        </div>

        <div class="form-group col-span-2">
          <label>Car Name / Model</label>
          <input
            type="text"
            name="name"
            [(ngModel)]="newVehicle.name"
            placeholder="e.g. Mercedes S-Class"
            required
            class="gold-input"
          />
        </div>

        <div class="form-group">
          <label>License Plate</label>
          <input
            type="text"
            name="plate"
            [(ngModel)]="newVehicle.plate"
            placeholder="TN · XXXX AB"
            required
            class="gold-input"
          />
        </div>

        <div class="form-group">
          <label>Type / Class</label>
          <input
            type="text"
            name="type"
            [(ngModel)]="newVehicle.type"
            placeholder="Luxury Sedan"
            required
            class="gold-input"
          />
        </div>

        <div class="form-group">
          <label>Year</label>
          <input
            title="year"
            type="number"
            name="year"
            [(ngModel)]="newVehicle.year"
            required
            class="gold-input"
          />
        </div>

        <div class="form-group">
          <label>Fuel Type</label>
          <select name="fuel" [(ngModel)]="newVehicle.fuel" class="gold-select" title="fuel">
            <option value="Petrol">Petrol</option>
            <option value="Diesel">Diesel</option>
            <option value="Hybrid">Hybrid</option>
            <option value="Electric">Electric</option>
          </select>
        </div>

        <div class="form-group">
          <label>Rate Per Day ($)</label>
          <input
            title="rate"
            type="number"
            name="ratePerDay"
            [(ngModel)]="newVehicle.ratePerDay"
            required
            class="gold-input"
          />
        </div>

        <div class="form-group">
          <label>Initial Mileage (km)</label>
          <input
            title="mileage"
            type="number"
            name="mileage"
            [(ngModel)]="newVehicle.mileage"
            required
            class="gold-input"
          />
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn-cancel" (click)="onCancel()">Cancel</button>
        <button type="submit" class="btn-submit" [disabled]="!vehicleForm.form.valid">
          Save Vehicle
        </button>
      </div>
    </form>
  </div>
</div>
