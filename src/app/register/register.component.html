<div class="page">
  <div class="left-panel">
    <div class="brand-mark">
      <mat-icon class="brand-icon" style="font-size: 32px; width: 32px; height: 32px; color: #c9a84c">directions_car</mat-icon>
      <span class="brand-name">RentCar</span>
    </div>
    <div class="hero-text">Join the<br /><em>exclusive</em><br />fleet.</div>
    <p class="hero-sub">Experience luxury at your fingertips</p>
    <div class="divider"></div>
  </div>

  <div class="right-panel">
    <div class="card">
      <div class="corner-tl"></div>
      <div class="corner-br"></div>

      @if (isLoading()) {
        <div class="loading">
          <p>Creating your account...</p>
        </div>
      } @else {
        <p class="card-eyebrow">Getting started</p>
        <h1 class="card-title">Create your<br />account</h1>

        @if (error()) {
          <div class="error-msg" style="margin-bottom: 20px;">{{ error() }}</div>
        }

        <form (submit)="onRegister($event)" class="login-form">
          <div class="form-row">
            <div class="form-group">
              <label for="firstName">First Name</label>
              <input type="text" id="firstName" [formField]="registerForm.firstName" class="form-control" />
            </div>
            <div class="form-group">
              <label for="lastName">Last Name</label>
              <input type="text" id="lastName" [formField]="registerForm.lastName" class="form-control" />
            </div>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" [formField]="registerForm.email" class="form-control" placeholder="example@mail.com" />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" [formField]="registerForm.password" class="form-control" placeholder="••••••••" />
          </div>

          <button type="submit" class="btn btn-primary" [disabled]="registerForm().invalid()">
            Create Account
          </button>
        </form>

        <div class="card-footer">
          Already have an account? <a routerLink="/login">Sign In</a>
        </div>
      }
    </div>
  </div>
</div>
