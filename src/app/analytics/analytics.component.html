<div class="shell">
  <div class="bg-layer"></div>
  <main class="main">
    <rentcar-topbar title="Analytics Dashboard" eyebrow="Metrics"></rentcar-topbar>

    <div class="content">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Fleet Utilization</div>
          <div class="stat-value">84%</div>
          <div class="stat-change up">+2% this week</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Active Users</div>
          <div class="stat-value">1,204</div>
          <div class="stat-change up">+45 this week</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Avg Rental Duration</div>
          <div class="stat-value">4.2 Days</div>
          <div class="stat-change down">-0.1 days</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Customer Satisfaction</div>
          <div class="stat-value">4.8/5</div>
          <div class="stat-change up">Stable</div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header" style="padding: 1.5rem 1.5rem 0">
          <div>
            <div class="panel-eyebrow">Performance</div>
            <div class="panel-title-main">Top Performing Vehicles</div>
          </div>
        </div>
        <div class="table-head">
          <div class="th">Vehicle</div>
          <div class="th">Total Rentals</div>
          <div class="th">Utilization</div>
        </div>
        <div class="client-row">
          <div class="td client-info">
            <div class="avatar av-gold">M</div>
            <div>
              <div class="client-name">Mercedes S-Class</div>
              <div class="client-email">Luxury</div>
            </div>
          </div>
          <div class="td td-amount">142</div>
          <div class="td"><span class="badge badge-active">92%</span></div>
        </div>
        <div class="client-row">
          <div class="td client-info">
            <div class="avatar av-blue">B</div>
            <div>
              <div class="client-name">BMW X5</div>
              <div class="client-email">SUV</div>
            </div>
          </div>
          <div class="td td-amount">118</div>
          <div class="td"><span class="badge badge-available">88%</span></div>
        </div>
      </div>
    </div>
  </main>
</div>
